{% extends 'base.html' %}{% block content %}<h1>SoftPot calibration</h1><p>Physically position the syringe, then capture each point. Saving requires at least three monotonic points.</p><table id="points"><thead><tr><th>Volume</th><th>Mean voltage</th><th>SD</th></tr></thead><tbody></tbody></table>{% for v in [100,75,50,25,0] %}<button class="capture" data-volume="{{v}}">Capture {{v}} ml</button>{% endfor %}<button id="save">Validate and save</button><p id="message" aria-live="polite"></p><div id="warnings" class="warning" aria-live="polite"></div>{% endblock %}{% block scripts %}<script>
const points = new Map();
function showPoints(){document.querySelector('#points tbody').innerHTML=[...points.values()].sort((a,b)=>b.volume_ml-a.volume_ml).map(p=>`<tr><td>${p.volume_ml} ml</td><td>${p.mean_voltage_v.toFixed(4)} V</td><td>${p.standard_deviation_v.toFixed(4)} V</td></tr>`).join('')}
document.querySelectorAll('.capture').forEach(b=>b.onclick=async()=>{let r=await fetch('/api/softpot/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({volume_ml:+b.dataset.volume})});let d=await r.json();if(r.ok){points.set(d.volume_ml,d);showPoints();document.querySelector('#message').className='good'}else{document.querySelector('#message').className='bad'}document.querySelector('#message').textContent=r.ok?`Captured ${d.volume_ml} ml: ${d.mean_voltage_v.toFixed(4)} V`:d.error});
document.querySelector('#save').onclick=async()=>{let r=await fetch('/api/softpot/save',{method:'POST'}),d=await r.json(),message=document.querySelector('#message'),warnings=document.querySelector('#warnings');message.className=r.ok?'good':'bad';message.textContent=r.ok?d.message:d.error;let items=d.validation?.warnings||[];warnings.innerHTML=items.length?`<strong>Warning:</strong><ul>${items.map(w=>`<li>${w}</li>`).join('')}</ul>`:''}
</script>{% endblock %}
