{% extends 'base.html' %}{% block content %}<h1>SoftPot calibration</h1><p>Physically position the syringe, then capture each point. Saving requires at least three monotonic points.</p><div id="points"></div>{% for v in [100,75,50,25,0] %}<button class="capture" data-volume="{{v}}">Capture {{v}} ml</button>{% endfor %}<button id="save">Validate and save</button><p id="message"></p>{% endblock %}{% block scripts %}<script>document.querySelectorAll('.capture').forEach(b=>b.onclick=async()=>{let r=await fetch('/api/softpot/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({volume_ml:+b.dataset.volume})});let d=await r.json();document.querySelector('#message').textContent=r.ok?`Captured ${d.volume_ml} ml: ${d.mean_voltage_v.toFixed(4)} V`:d.error});document.querySelector('#save').onclick=async()=>{let r=await fetch('/api/softpot/save',{method:'POST'}),d=await r.json();document.querySelector('#message').textContent=r.ok?'Saved. Restart the instrument to load it.':d.error}</script>{% endblock %}
